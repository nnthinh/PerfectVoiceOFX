openapi: 3.1.0
info:
  title: PerfectVoice engine sidecar
  version: 0.1.0
  description: |
    Localhost sidecar HTTP.

    Bind **127.0.0.1 only**. Auth is `Authorization: Bearer <token>` from a
    0600 one-shot token file (or stdin). `protocol_version` is an integer:
    panel and engine must match major; engine minor ≥ panel.

    `POST /v1/models/download` is user-click only. Jobs and `Separator()`
    never call it.
servers:
  - url: http://127.0.0.1
    description: Engine sidecar (port chosen at spawn; printed on READY line)
security:
  - bearerAuth: []
tags:
  - name: meta
  - name: jobs
paths:
  /v1/health:
    get:
      tags: [meta]
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/capabilities:
    get:
      tags: [meta]
      summary: Devices, local models, protocol
      operationId: getCapabilities
      responses:
        "200":
          description: What this engine can run right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/models/download:
    post:
      tags: [meta]
      summary: User-click official Demucs weight download
      operationId: downloadModel
      description: |
        Body `{ name }` (`htdemucs` or `htdemucs_ft`). Allowlisted hosts
        only; sha256 verified into `local_repo`. Not invoked from
        `POST /v1/jobs` or `Separator()`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  enum: [htdemucs, htdemucs_ft]
      responses:
        "200":
          description: Files written and checksummed (JSON or SSE `done`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, ready, files]
                properties:
                  name:
                    type: string
                  ready:
                    type: boolean
                  files:
                    type: object
                    additionalProperties:
                      type: string
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Allowlisted fetch or checksum failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/jobs:
    post:
      tags: [jobs]
      summary: Enqueue a job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: Job snapshot (HTTP record; job.json only when status=done)
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Request cancel
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/jobs/{id}/events:
    get:
      tags: [jobs]
      summary: SSE progress
      operationId: streamJobEvents
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: |
            `text/event-stream`. Fetch from Electron main/preload only.

            Example events:
            `event: progress` data `{clip_id, segment_offset, audio_length}`
            `event: done` data `{id}`
            `event: error` data `{id, message}`
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: hex
      description: 256-bit token from the one-shot token file / stdin.

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Schema / path / allowed_roots rejection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown job id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, protocol_version]
      properties:
        status:
          type: string
          enum: [ok]
        protocol_version:
          type: integer
          minimum: 1

    Capabilities:
      type: object
      additionalProperties: false
      required:
        - protocol_version
        - devices
        - models_ready
        - window_seconds
        - window_overlap_seconds
        - memory_cap_bytes
      properties:
        protocol_version:
          type: integer
          minimum: 1
        devices:
          type: array
          items:
            type: string
            enum: [mps, cuda, cpu]
        models_ready:
          type: object
          additionalProperties:
            type: boolean
          description: Local files present (name → ready). No remote probe.
        window_seconds:
          type: number
          exclusiveMinimum: 0
          description: Long-form Demucs window length (10 min). OLA is outside Demucs.
        window_overlap_seconds:
          type: number
          minimum: 0
          description: Overlap between adjacent 10-min windows (1 s).
        memory_cap_bytes:
          type: integer
          minimum: 1
          description: |
            n_samples * ch * 4 trip for the windowed path. Means "do not
            hand Demucs the whole clip", not a process RSS limit.

    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [clips, params, allowed_roots, output_dir]
      properties:
        clips:
          type: array
          minItems: 1
          items:
            $ref: "./schema/clip.v1.json"
        params:
          $ref: "./schema/params.v1.json"
        allowed_roots:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Sandbox roots (media + output). Engine canonicalizes.
        output_dir:
          type: string
          minLength: 1

    JobAccepted:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued]

    CancelAccepted:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [cancelling, cancelled]

    JobRecord:
      description: |
        HTTP snapshot for GET /v1/jobs/{id}. On-disk `job.json` stays
        closed `perfectvoice.job.v1` (no `status` / `error`). This object
        is independent so those HTTP fields are legal.

        When `status=done`, `clips[]` MUST be the job.v1 `clip_result`
        shape (`handles_*_actual`, `wet_dry_sample_rate`, …). In-progress
        / error / cancelled rows may omit those fields.
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        schema:
          const: perfectvoice.job.v1
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        engine_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        params:
          $ref: "./schema/params.v1.json"
        clips:
          type: array
          items:
            $ref: "#/components/schemas/JobClipSnapshot"
        status:
          type: string
          enum: [queued, running, done, error, cancelled, cancelling]
        error:
          type: string
      if:
        properties:
          status:
            const: done
        required: [status]
      then:
        required: [schema, created_at, engine_version, params, clips]
        properties:
          clips:
            type: array
            minItems: 1
            items:
              $ref: "./schema/job.v1.json#/$defs/clip_result"

    JobClipSnapshot:
      description: |
        In-progress clip row. Result fields optional until `status=done`,
        when JobRecord requires job.v1 `clip_result`.
      type: object
      additionalProperties: false
      required: [clip_id]
      properties:
        clip_id:
          type: string
          format: uuid
        input_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        output_path:
          type: string
          minLength: 1
        output_samples:
          type: integer
          minimum: 0
        handles_left_actual:
          type: number
          minimum: 0
        handles_right_actual:
          type: number
          minimum: 0
        wet_dry_sample_rate:
          type: integer
          enum: [44100, 48000]
        peak:
          type: number
          minimum: 0
        cache_hit:
          type: boolean


    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
        detail:
          type: string

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PerfectVoice</title>
    <script type="text/javascript" src="./renderer.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Never show outer window scrollbar */
            background: #191919;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 12px 16px 10px;
            gap: 8px;
            overflow: hidden;
        }

        /* 1. Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            border-bottom: 1px solid #282828;
        }
        .app-brand {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .app-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin: 0;
            letter-spacing: -0.2px;
        }
        .app-tag {
            font-size: 11px;
            color: #777;
        }
        .app-status-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, monospace;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.ok { background: #52c41a; box-shadow: 0 0 6px rgba(82, 196, 26, 0.4); }
        .status-dot.off { background: #ff4d4f; }
        .status-text.ok { color: #52c41a; }
        .status-text.off { color: #888; }

        /* 2. Controls Section */
        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 600;
            color: #bbb;
        }
        .val-badge {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 11px;
            color: #3ee0c5;
            font-weight: 600;
        }
        
        select, input[type="range"] {
            background: #111;
            color: #eee;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 12px;
            width: 100%;
            outline: none;
            transition: border-color 0.15s;
        }
        select:focus {
            border-color: #3ee0c5;
        }
        input[type="range"] {
            padding: 0;
            cursor: pointer;
            accent-color: #3ee0c5;
            height: 5px;
            background: #252525;
        }

        /* 2-Column parameter grid for shifts and overlap */
        .param-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Checkboxes in a horizontal row */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 1px 0;
        }
        .check-opt {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #bbb;
            cursor: pointer;
        }
        .check-opt input {
            cursor: pointer;
            accent-color: #3ee0c5;
            margin: 0;
        }

        /* 3. Action Buttons */
        .actions-row {
            display: flex;
            gap: 8px;
            margin-top: 1px;
        }
        button.btn-primary {
            flex: 1;
            padding: 9px 14px;
            background: #1d4d44;
            color: #3ee0c5;
            border: 1px solid #2dbfa6;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button.btn-primary:hover:not(:disabled) {
            background: #27695d;
            color: #fff;
        }
        button.btn-cancel {
            padding: 9px 14px;
            background: #222;
            color: #999;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button.btn-cancel:hover:not(:disabled) {
            background: #2d2d2d;
            color: #ddd;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        /* 4. Inference Monitor (Flex-grow fills all remaining space) */
        .job-card {
            flex: 1;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            background: #111;
            border: 1px solid #282828;
            border-radius: 4px;
            overflow: hidden;
        }
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161616;
            padding: 5px 10px;
            border-bottom: 1px solid #222;
            font-size: 10px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .job-badge {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }
        .job-badge.idle { background: #222; color: #888; }
        .job-badge.running { background: #133830; color: #3ee0c5; }
        .job-badge.cached { background: #382c13; color: #f5a623; }
        .job-badge.done { background: #183818; color: #52c41a; }
        .job-badge.error { background: #381818; color: #ff4d4f; }

        .progress-section {
            padding: 7px 10px 5px;
            background: #131313;
            border-bottom: 1px solid #202020;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .progress-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10.5px;
        }
        .progress-label { color: #999; }
        .progress-stat {
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-weight: 600;
            color: #3ee0c5;
        }
        .bar-track {
            height: 5px;
            background: #202020;
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-track.sub-track { height: 3px; background: #191919; }
        .bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.15s ease-out;
        }
        .bar-fill.main-bar { background: linear-gradient(90deg, #2dbfa6, #3ee0c5); }
        .bar-fill.sub-bar { background: #f5a623; }

        .job-stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
            border-top: 1px solid #1c1c1c;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 10.5px;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .stat-k { color: #666; }
        .stat-v { color: #eee; font-weight: 600; }

        /* Terminal Activity Log */
        .job-log {
            flex: 1; /* Takes all remaining vertical space inside monitor */
            min-height: 40px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px;
            line-height: 1.45;
            color: #ccc;
            padding: 6px 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            background: #0a0a0a;
        }

        /* 5. Hardware Telemetry Bar (Pinned at bottom) */
        .telemetry-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
            border: 1px solid #242424;
            border-radius: 4px;
            padding: 5px 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 10.5px;
        }
        .telemetry-box[hidden] { display: none; }
        .telemetry-item { display: flex; align-items: center; gap: 4px; }
        .telemetry-label { color: #777; }
        .telemetry-val { color: #3ee0c5; font-weight: 600; }

        #error, #resolveNote, #jobError {
            color: #ff6b6b;
            font-size: 11px;
            margin: 0;
        }
        #jobError:empty { display: none; }

        /* Model Download Progress */
        #dlWrap {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px 10px;
        }
        #dlWrap[hidden] { display: none; }
        #dlLabel { font-size: 11px; margin-bottom: 4px; color: #ccc; }
        .bar {
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            overflow: hidden;
        }
        #dlBar { height: 100%; width: 0; background: #3ee0c5; }
        #dlLog { font-size: 10px; color: #888; font-family: ui-monospace, monospace; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- 1. Header -->
        <header class="app-header">
            <div class="app-brand">
                <span class="app-title">PerfectVoice</span>
                <span class="app-tag">DaVinci Resolve Vocal Isolation</span>
            </div>
            <div class="app-status-box">
                <span id="statusDot" class="status-dot off"></span>
                <span id="status" class="status-text off">Starting engine…</span>
            </div>
        </header>

        <span id="enginePath" hidden></span>
        <div id="error"></div>
        <div id="resolveNote"></div>

        <!-- 2. Controls Section -->
        <div class="controls-card">
            <div class="form-row">
                <div class="label-row">
                    <label for="modelSelect">Preset</label>
                </div>
                <select id="modelSelect">
                    <option value="htdemucs" selected>Fast (htdemucs)</option>
                    <option value="htdemucs_ft">Quality (htdemucs_ft)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="label-row">
                    <label for="wetInput">Voice isolation mix (Wet)</label>
                    <span id="wetVal" class="val-badge">0.85 (85%)</span>
                </div>
                <input id="wetInput" type="range" min="0" max="1" step="0.05" value="0.85">
            </div>

            <div class="param-grid">
                <div class="form-row">
                    <div class="label-row">
                        <label for="shiftsSelect">Demucs shifts</label>
                    </div>
                    <select id="shiftsSelect">
                        <option value="1" selected>1 (Fast)</option>
                        <option value="2">2 (Better)</option>
                        <option value="4">4 (Best quality)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="label-row">
                        <label for="overlapSelect">Segment overlap</label>
                    </div>
                    <select id="overlapSelect">
                        <option value="0.25" selected>0.25 (25%)</option>
                        <option value="0.5">0.50 (50%)</option>
                        <option value="0.75">0.75 (75%)</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-row">
                <label class="check-opt">
                    <input id="muteCheck" type="checkbox">
                    <span>Mute original clips</span>
                </label>
                <label class="check-opt">
                    <input id="cacheCheck" type="checkbox" checked>
                    <span>Use cache</span>
                </label>
            </div>

            <div class="actions-row">
                <button id="removeBtn" class="btn-primary" type="button" disabled>Clean voice</button>
                <button id="cancelBtn" class="btn-cancel" type="button" disabled>Cancel</button>
            </div>
        </div>

        <div id="dlWrap" hidden>
            <div id="dlLabel">Downloading model…</div>
            <div class="bar"><div id="dlBar"></div></div>
            <div id="dlLog"></div>
        </div>

        <!-- 3. Inference Monitor (Flex fills remaining viewport height) -->
        <div class="job-card">
            <div class="job-header">
                <span class="job-title">Inference Monitor</span>
                <span id="jobBadge" class="job-badge idle">IDLE</span>
            </div>
            
            <div class="progress-section">
                <!-- Overall Progress -->
                <div class="progress-block">
                    <div class="progress-info">
                        <span class="progress-label">Total Progress</span>
                        <span id="overallPctText" class="progress-stat">0%</span>
                    </div>
                    <div class="bar-track"><div id="overallBar" class="bar-fill main-bar"></div></div>
                </div>

                <!-- Current Pass Progress -->
                <div class="progress-block">
                    <div class="progress-info">
                        <span id="currentPassTitle" class="progress-label">Current Pass</span>
                        <span id="currentPassPctText" class="progress-stat">—</span>
                    </div>
                    <div class="bar-track sub-track"><div id="currentBar" class="bar-fill sub-bar"></div></div>
                </div>

                <!-- ETA & Stats -->
                <div class="job-stats-row">
                    <div class="stat-item">
                        <span class="stat-k">Elapsed:</span>
                        <span id="statElapsed" class="stat-v">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-k">ETA:</span>
                        <span id="statEta" class="stat-v">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-k">Speed:</span>
                        <span id="statSpeed" class="stat-v">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-k">Passes:</span>
                        <span id="statPasses" class="stat-v">—</span>
                    </div>
                </div>
            </div>

            <!-- Terminal Activity Log (Scrolls internally) -->
            <div id="jobLog" class="job-log">Ready. Select a clip on the timeline, then click Clean voice.</div>
        </div>

        <!-- 4. Hardware Telemetry Bar (Pinned at bottom) -->
        <div id="telemetryWrap" class="telemetry-box" hidden>
            <div class="telemetry-item">
                <span class="telemetry-label">Compute:</span>
                <span id="telCompute" class="telemetry-val">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">RAM:</span>
                <span id="telRam" class="telemetry-val">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">CPU:</span>
                <span id="telCpu" class="telemetry-val">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Time:</span>
                <span id="telTime" class="telemetry-val">—</span>
            </div>
        </div>

        <div id="jobError"></div>
    </div>
</body>
</html>
